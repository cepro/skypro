  d.rolling7 = d3.mean(w, v => v.total);
});

// Chart dimensions — landscape

const height = 400 - margin.top - margin.bottom;

  .attr("width", width + margin.left + margin.right)
  .attr("height", height + margin.top + margin.bottom)

  .domain([0, d3.max(data, d => d.total) * 1.05])
  .range([height, 0]);

// Grid lines
svg.append("g")
  .attr("class", "grid")
  .call(d3.axisLeft(y).tickSize(-width).tickFormat(""));

  .join("rect")
  .attr("class", "bar")
  .attr("x", d => x(d.date) - barWidth / 2)
  .attr("y", d => y(d.total))

  .attr("height", d => height - y(d.total))

  .attr("opacity", 0.6);

  .x(d => x(d.date))
  .y(d => y(d.rolling7))
  .curve(d3.curveMonotoneX);

svg.append("rect")

  .attr("height", height)

  .attr("pointer-events", "all")
  .on("mousemove", function(event) {
    const [mx] = d3.pointer(event);
    const dt = x.invert(mx);
    const i = bisect(data, dt, 1);
    const d = i >= data.length ? data[data.length - 1] :

    tooltip.style("display", "block")
      .style("left", (event.pageX + 12) + "px")
      .style("top", (event.pageY - 40) + "px")
      .html(`<strong>${d3.timeFormat("%a %d %b %Y")(d.date)}</strong><br>` +

            `7-day avg: ${d3.format(",.0f")(d.rolling7)} MWh`);
  })
  .on("mouseout", () => tooltip.style("display", "none"));

// Stats summary
const totalMWh = d3.sum(data, d => d.total);
const avgDaily = d3.mean(data, d => d.total);
const peakDay = data.reduce((a, b) => a.total > b.total ? a : b);

d3.select("#stats").html(
